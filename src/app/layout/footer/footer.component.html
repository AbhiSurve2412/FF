<footer class="footer">
  <div class="footer__container">

    <!-- ── Top section ──────────────────────────────── -->
    <div class="footer__top">

      <!-- Brand column -->
      <div class="footer__brand-col">
        <a class="footer__brand" routerLink="/">
          <svg class="footer__logo" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <rect width="28" height="28" rx="7" class="footer__logo-bg" />
            <path
              d="M9 7.5h10v2.8h-7.2v2.8H18v2.8h-6.2v4.6H9V7.5z"
              class="footer__logo-letter"
            />
          </svg>
          <span class="footer__wordmark">FixPass</span>
        </a>
        <p class="footer__tagline">
          Your all-in-one platform for study material, exam preparation, placement prep, and career growth.
        </p>
      </div>

      <!-- Links column -->
      <div class="footer__links-col">
        <h3 class="footer__links-heading">Company</h3>
        <ul class="footer__links" role="list">
          @for (link of companyLinks; track link.route) {
            <li>
              <a class="footer__link" [routerLink]="link.route">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </div>

    </div>

    <!-- ── Bottom bar ────────────────────────────────── -->
    <div class="footer__bottom">
      <p class="footer__copyright">
        &copy; {{ currentYear }} FixPass. All rights reserved.
      </p>
    </div>

  </div>
</footer>
